<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가계부 로그인</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" id="login-form">
      <h1>가계부</h1>
      <p>비밀번호를 입력하면 접속할 수 있어요.</p>
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" autofocus />
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn btn-primary">입장하기</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    const params = new URLSearchParams(location.search);
    const redirect = params.get("redirect") || "/";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const password = document.getElementById("password").value;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          location.href = redirect;
        } else {
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "로그인에 실패했습니다.";
        }
      } catch {
        errorEl.textContent = "네트워크 오류가 발생했습니다.";
      }
    });
  </script>
</body>
</html>
